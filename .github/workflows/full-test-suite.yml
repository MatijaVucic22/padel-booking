name: Full Test Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  full-verification:
    name: Full Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/PadelBooking.sln

      - name: Build backend
        run: dotnet build backend/PadelBooking.sln -c Release --no-restore

      - name: Test complete backend suite
        run: dotnet test backend/PadelBooking.sln -c Release --no-build

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.playwright-browsers
        run: npx playwright install --with-deps chromium

      - name: Test all browser flows against isolated Docker environment
        run: npm run test:e2e:isolated --prefix frontend
