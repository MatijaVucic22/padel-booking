services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: padel_booking_e2e
      MYSQL_USER: padel_e2e
      MYSQL_PASSWORD: ${E2E_MYSQL_PASSWORD:?Set by the E2E runner}
      MYSQL_ROOT_PASSWORD: ${E2E_MYSQL_ROOT_PASSWORD:?Set by the E2E runner}
    volumes:
      - e2e_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=padel_booking_e2e;User=padel_e2e;Password=${E2E_MYSQL_PASSWORD:?Set by the E2E runner}
      Jwt__Key: ${E2E_JWT_KEY:?Set by the E2E runner}
      Jwt__Issuer: PadelBooking.Api
      Jwt__Audience: PadelBooking.Client
      Cors__AdditionalOrigin: http://localhost:5189
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_FRONTEND_URL: http://localhost:5189
    ports:
      - "127.0.0.1:5248:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  e2e_mysql_data:
